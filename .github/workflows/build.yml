{"name":"Build Aura APK","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v5"},{"name":"Unzip source","run":"if [ -f AuraMusic.zip ]; then unzip -o -q AuraMusic.zip; fi; ls -la"},{"uses":"actions/setup-java@v5","with":{"distribution":"temurin","java-version":"17"}},{"name":"Accept Android licenses","run":"yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true"},{"name":"Get Gradle","run":"wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip && unzip -q gradle-8.9-bin.zip -d $HOME"},{"name":"Build APK","run":"$HOME/gradle-8.9/bin/gradle assembleRelease --no-daemon --stacktrace"},{"name":"Rename APK","run":"cp app/build/outputs/apk/release/app-release.apk Aura-Music.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"Aura-Music-APK","path":"Aura-Music.apk"}}]}}}
